<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background transparent for versatility -->
  <g fill="none" stroke="currentColor" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" text-rendering="geometricPrecision">
    <!-- Outer Radiating Rays (Geometric Dawn) -->
    <path d="M256 32 V72 M256 440 V480 M32 256 H72 M440 256 H480" stroke-width="28" />
    <path d="M97.6 97.6 L125.9 125.9 M386.1 386.1 L414.4 414.4 M97.6 414.4 L125.9 386.1 M386.1 125.9 L414.4 97.6" stroke-width="20" opacity="0.85" />
    
    <!-- Outer Geometric Octagram Frame -->
    <rect x="144" y="144" width="224" height="224" rx="16" fill="currentColor" fill-opacity="0.12" stroke-width="20" />
    <rect x="144" y="144" width="224" height="224" rx="16" transform="rotate(45 256 256)" fill="currentColor" fill-opacity="0.12" stroke-width="20" />

    <!-- Core Solid 8-Pointed Star -->
    <polygon points="256,168 280,216 332,192 319,244 368,256 319,268 332,320 280,296 256,344 232,296 180,320 193,268 144,256 193,244 180,192 232,216" fill="currentColor" stroke="none" />
    
    <!-- Central Core Eye of Illumination -->
    <circle cx="256" cy="256" r="28" fill="none" stroke="currentColor" stroke-width="12" />
  </g>
</svg>
