<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g fill="currentColor" text-rendering="geometricPrecision">
    <!-- Center Core Node -->
    <circle cx="256" cy="256" r="36" />
    
    <!-- Inner Linked Facet Ring -->
    <path d="M256 160 L288 224 L352 256 L288 288 L256 352 L224 288 L160 256 L224 224 Z" fill-opacity="0.25" stroke="currentColor" stroke-width="12" />

    <!-- 4 Cardinal Outer Linked Diamonds -->
    <polygon points="256,64 288,128 256,192 224,128" />
    <polygon points="256,448 288,384 256,320 224,384" />
    <polygon points="64,256 128,224 192,256 128,288" />
    <polygon points="448,256 384,224 320,256 384,288" />

    <!-- 4 Diagonal Outer Linked Diamonds -->
    <polygon points="120,120 180,140 192,200 140,180" />
    <polygon points="392,392 332,372 320,312 372,332" />
    <polygon points="392,120 372,180 312,192 332,140" />
    <polygon points="120,392 140,332 200,320 180,372" />

    <!-- Outer Interconnecting Node Dots -->
    <circle cx="256" cy="56" r="16" />
    <circle cx="256" cy="456" r="16" />
    <circle cx="56" cy="256" r="16" />
    <circle cx="456" cy="256" r="16" />
    <circle cx="115" cy="115" r="14" />
    <circle cx="397" cy="397" r="14" />
    <circle cx="397" cy="115" r="14" />
    <circle cx="115" cy="397" r="14" />
  </g>
</svg>
